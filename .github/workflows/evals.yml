name: Evals
on:
  pull_request:
  push:
    branches: [main]
jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # the bot and tinyeval's judge both use it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci && npm run typecheck
      - run: npx tinyeval -n 3
        if: env.ANTHROPIC_API_KEY != ''
      - run: echo "::notice::Add the ANTHROPIC_API_KEY repository secret to run the evals."
        if: env.ANTHROPIC_API_KEY == ''
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: eval-results.json
